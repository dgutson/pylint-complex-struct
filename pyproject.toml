[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pylint-complex-struct"
version = "0.1.0"
description = "A pylint checker that flags over-nested type annotations and pushes them towards type aliases, NamedTuples and TypedDicts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Daniel Gutson"}]
keywords = ["pylint", "pylint-plugin", "linter", "typing", "type-annotations", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["pylint>=4.0"]

[project.urls]
Homepage = "https://github.com/dgutson/pylint-complex-struct"
Repository = "https://github.com/dgutson/pylint-complex-struct"
Issues = "https://github.com/dgutson/pylint-complex-struct/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["pylint_complex_struct"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
load-plugins = ["pylint_complex_struct"]
# The functional fixture is deliberately full of violations.
ignore-paths = ["tests/functional/.*"]

[tool.pylint.basic]
# A test name is its documentation.
no-docstring-rgx = "^(_|test_)"
